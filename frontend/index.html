<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>VideoShare — Dashboard</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
</head>
<body>
<nav id="nav"></nav>
<h1>Latest videos</h1>
<div class="grid" id="grid"></div>
<script src="/js/api.js"></script>
<script>
renderNav();
document.getElementById('grid').innerHTML = skeletonGrid(6).match(/<div class="grid">([\s\S]*)<\/div>/)[1];
apiFetch('/videos').then((videos) => {
const grid = document.getElementById('grid');
if (!videos.length) { grid.innerHTML = '<p class="meta">No videos yet.</p>'; return; }
grid.innerHTML = videos.map((v) => `
  <a class="card" href="/watch.html?id=${v.id}">
    <div class="thumb">${v.genre}</div>
    <div class="body">
      <h3>${v.title}</h3>
      <div class="meta">${v.ageRating} · by ${v.creatorName}</div>
    </div>
  </a>`).join('');
    }).catch((e) => { document.getElementById('grid').innerHTML = `<p class="error">${e.message}</p>`; });
</script>
</body>
</html>

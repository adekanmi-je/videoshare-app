<!DOCTYPE html>
<html>
<head><meta charset="utf-8" /><title>Sign up</title><link rel="stylesheet" href="/css/style.css" /></head>
<body>
  <nav id="nav"></nav>
  <h1>Create a consumer account</h1>
  <form id="f" onsubmit="return false;">
    <input id="displayName" placeholder="Display name" required />
    <input id="email" type="email" placeholder="Email" required />
    <input id="password" type="password" placeholder="Password" required />
    <button id="submit">Sign up</button><p class="error" id="err"></p>
  </form>
  <script src="/js/api.js"></script>
  <script>
    renderNav();
    document.getElementById('submit').onclick = async () => {
      try {
        const data = await apiFetch('/register', { method: 'POST', body: JSON.stringify({
          displayName: document.getElementById('displayName').value,
          email: document.getElementById('email').value,
          password: document.getElementById('password').value }) });
        setSession(data.token, data.role, data.displayName);
        location.href = '/index.html';
      } catch (e) { document.getElementById('err').textContent = e.message; }
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head><meta charset="utf-8" /><title>VideoShare — Watch</title><link rel="stylesheet" href="/css/style.css" /></head>
<body>
  <nav id="nav"></nav>
  <div id="content">Loading…</div>
  <script src="/js/api.js"></script>
  <script>
    renderNav();
    const id = new URLSearchParams(location.search).get('id');
    const content = document.getElementById('content');
    async function load() {
      const v = await apiFetch(`/videos/${id}`);
      content.innerHTML = `
        <h1>${v.title}</h1>
        <div class="meta">${v.genre} · ${v.ageRating} · Publisher: ${v.publisher} · Producer: ${v.producer} · by ${v.creatorName}</div>
        <p>Average rating: ${v.avgRating ? v.avgRating.toFixed(1) + ' / 5' : 'No ratings yet'}</p>
        <video controls src="${v.playbackUrl}"></video>
        <h2>Comments</h2>
        <div id="commentForm"></div>
        <div id="comments">${v.comments.map((c) => `
          <div class="comment"><strong>${c.displayName}</strong> ${c.rating ? `— ${c.rating}/5` : ''}<div>${c.text || ''}</div></div>`).join('') || '<p>No comments yet.</p>'}</div>`;
      const formHost = document.getElementById('commentForm');
      if (getToken()) {
        formHost.innerHTML = `
          <form id="cForm" onsubmit="return false;">
            <textarea id="cText" placeholder="Add a comment"></textarea>
            <select id="cRating"><option value="">No rating</option>${[1,2,3,4,5].map((n) => `<option value="${n}">${n} star${n>1?'s':''}</option>`).join('')}</select>
            <button id="cSubmit">Post</button><p class="error" id="cErr"></p>
          </form>`;
        document.getElementById('cSubmit').onclick = async () => {
          try {
            const text = document.getElementById('cText').value.trim();
            const ratingVal = document.getElementById('cRating').value;
            await apiFetch(`/videos/${id}/comments`, { method: 'POST', body: JSON.stringify({ text, rating: ratingVal ? Number(ratingVal) : undefined }) });
            load();
          } catch (e) { document.getElementById('cErr').textContent = e.message; }
        };
      } else { formHost.innerHTML = `<p><a href="/login.html">Log in</a> to comment or rate.</p>`; }
    }
    load().catch((e) => { content.innerHTML = `<p class="error">${e.message}</p>`; });
  </script>
</body>
</html>
